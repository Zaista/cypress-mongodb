name: Run cypress tests

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # All node/mongodb combinations with default config
          - node-version: 20
            mongodb-version: 7.0
            cypress-config: default
          - node-version: 20
            mongodb-version: 8.0
            cypress-config: default
          - node-version: 22
            mongodb-version: 7.0
            cypress-config: default
          - node-version: 22
            mongodb-version: 8.0
            cypress-config: default
          - node-version: 24
            mongodb-version: 7.0
            cypress-config: default
          - node-version: 24
            mongodb-version: 8.0
            cypress-config: default
          # All config combinations with latest node/mongodb
          - node-version: 24
            mongodb-version: 8.0
            cypress-config: collection
          - node-version: 24
            mongodb-version: 8.0
            cypress-config: database
          - node-version: 24
            mongodb-version: 8.0
            cypress-config: uri

    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start MongoDB ${{ matrix.mongodb-version }}
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - working-directory: .
        run: npm install
      - working-directory: .
        run: npm run build
      - name: Run tests with ${{ matrix.cypress-config }} config
        working-directory: .
        run: npm run test:${{ matrix.cypress-config }}
        env:
          CI: true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.node-version }}-${{ matrix.mongodb-version }}-${{ matrix.cypress-config }}
          path: cypress/screenshots
